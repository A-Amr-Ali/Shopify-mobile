name = "Sofie Loyalty"
handle = "sofie-loyalty"
application_url = "https://shopify-mobile-production.up.railway.app"
embedded = true
client_id = "443655f566bb961bf61d4272f755aea3"

[access_scopes]
# read/write customers (lookup + metafields), read orders (earn/reverse),
# write discounts (mint codes), read products (recommendations/advisor).
scopes = "read_customers,write_customers,read_orders,write_discounts,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-mobile-production.up.railway.app/auth/callback",
  "https://shopify-mobile-production.up.railway.app/auth/shopify/callback",
  "https://shopify-mobile-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [
    "orders/paid",
    "refunds/create",
    "orders/cancelled",
    "customers/create",
    "checkouts/update"
  ]

[app_proxy]
url = "https://shopify-mobile-production.up.railway.app/apps/loyalty"
subpath = "loyalty"
prefix = "apps"

[pos]
embedded = false
